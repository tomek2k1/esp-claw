version: 1.0.0
devices:
  - name: display_lcd
    chip: ili9341
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_ili9341: "*"
    config:
      # TFT_eSPI rotation 0 in Freenove's FNK0104AB reference setup.
      swap_xy: false
      mirror_x: true
      mirror_y: false
      invert_color: true
      need_reset: true
      x_max: 240
      y_max: 320
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: 46
        spi_mode: 0
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        # LCD reset is wired to board reset; the driver uses software reset.
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        bits_per_pixel: 16
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
    peripherals:
      - name: spi_display

  - name: lcd_touch
    chip: ft6336u
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 240
        y_max: 320
        rst_gpio_num: 18
        int_gpio_num: 17
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        # Board Manager expects the left-shifted address: 0x38 << 1.
        i2c_addr: [0x70]

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight
